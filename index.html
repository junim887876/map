<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sistema Solar & Imóveis</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --usina: #f59e0b;
      --cliente: #3b82f6;
      --aluguel: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #map { width: 100%; height: 100%; background: #020617; }
    .leaflet-tile { filter: brightness(0.85) contrast(1.1) hue-rotate(190deg) invert(0.9) saturate(0.8); }

    /* Top Bar */
    .header {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .brand i { color: var(--usina); }
    .mode-badge { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,0.1); margin-left: 4px; }

    /* Floating Controls */
    .btn-add {
      position: absolute; bottom: 80px; right: 16px; z-index: 1000; width: 56px; height: 56px;
      border-radius: 50%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
      border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .bottom-bar {
      position: absolute; bottom: 16px; left: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; pointer-events: none;
    }
    .btn-act {
      flex: 1; pointer-events: auto; background: var(--card-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px;
      font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    }

    /* Crosshair Target */
    .crosshair {
      position: absolute; inset: 0; z-index: 1500; pointer-events: none; display: none;
      align-items: center; justify-content: center; flex-direction: column;
    }
    .crosshair.active { display: flex; }
    .crosshair-pin { width: 36px; height: 36px; border: 3px solid #2563eb; border-radius: 50%; background: rgba(37,99,235,0.2); }
    .crosshair-btn { pointer-events: auto; margin-top: 16px; background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }

    /* Modals */
    .modal {
      position: fixed; inset: 0; z-index: 2000; background: rgba(2,6,23,0.8); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.2s ease;
    }
    .modal.active { opacity: 1; pointer-events: auto; }
    .card {
      width: 100%; max-width: 480px; background: #1e293b; border-top-left-radius: 20px; border-top-right-radius: 20px;
      border: 1px solid var(--border); padding: 20px; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: 0.2s ease;
    }
    .modal.active .card { transform: translateY(0); }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; display: block; }
    .form-input, .form-textarea, .form-select {
      width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 14px; outline: none;
    }
    .form-row { display: flex; gap: 10px; } .form-row .form-group { flex: 1; }

    .type-selector { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: #0f172a;
      color: var(--text-muted); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    }
    .type-btn.active[data-type="usina"] { background: rgba(245, 158, 11, 0.2); border-color: var(--usina); color: var(--usina); }
    .type-btn.active[data-type="cliente"] { background: rgba(59, 130, 246, 0.2); border-color: var(--cliente); color: var(--cliente); }
    .type-btn.active[data-type="aluguel"] { background: rgba(16, 185, 129, 0.2); border-color: var(--aluguel); color: var(--aluguel); }

    .btn-main { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .btn-danger { width: 100%; background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 8px; }

    /* Custom Pins */
    .custom-pin { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .custom-pin.usina { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .custom-pin.cliente { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .custom-pin.aluguel { background: linear-gradient(135deg, #10b981, #047857); }
    .list-item { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Mira de Precisão -->
  <div class="crosshair" id="crosshair">
    <div class="crosshair-pin"></div>
    <button class="crosshair-btn" id="btnConfirmCrosshair"><i data-lucide="check"></i> Confirmar Ponto Aqui</button>
  </div>

  <button class="btn-add" id="btnToggleCrosshair"><i data-lucide="plus" style="width:26px;height:26px;"></i></button>

  <!-- Top Bar (Toque triplo/longo na marca ativa/desativa modo oculto) -->
  <div class="header">
    <div class="brand" id="brandBtn">
      <i data-lucide="sun"></i>
      <span>Solar & Imóveis</span>
      <span class="mode-badge" id="modeBadge">ADM</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn-act" id="btnExport" style="padding:6px 10px; font-size:11px;"><i data-lucide="download"></i> Backup .txt</button>
      <button class="btn-act" id="btnSummary" style="padding:6px 10px; font-size:11px;"><i data-lucide="pie-chart"></i> Resumo</button>
    </div>
  </div>

  <!-- Bottom Actions -->
  <div class="bottom-bar">
    <button class="btn-act" id="btnList"><i data-lucide="list"></i> Pontos</button>
    <button class="btn-act" id="btnLocate"><i data-lucide="navigation"></i> Meu GPS</button>
  </div>

  <!-- Form Modal -->
  <div class="modal" id="modalForm">
    <div class="card">
      <div class="card-head">
        <h3 id="formTitle">Novo Cadastro</h3>
        <i data-lucide="x" style="cursor:pointer;" onclick="closeModals()"></i>
      </div>

      <div class="type-selector">
        <div class="type-btn active" data-type="usina"><i data-lucide="sun"></i> Usina</div>
        <div class="type-btn" data-type="cliente"><i data-lucide="zap"></i> Cliente</div>
        <div class="type-btn" data-type="aluguel"><i data-lucide="home"></i> Aluguel</div>
      </div>

      <input type="hidden" id="pointId"><input type="hidden" id="pointLat"><input type="hidden" id="pointLng">

      <div class="form-group">
        <label class="form-label">Nome / Identificação</label>
        <input type="text" class="form-input" id="pointName" placeholder="Ex: Usina Solar 01 ou Casa R. das Flores">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" id="lblKwh">kWh / Mês</label>
          <input type="number" class="form-input" id="pointKwh" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label" id="lblVal">Desconto / Valor (R$)</label>
          <input type="number" class="form-input" id="pointVal" placeholder="0">
        </div>
      </div>

      <div class="form-group" id="rentalStatusGroup" style="display:none;">
        <label class="form-label">Status do Imóvel</label>
        <select class="form-select" id="pointStatus">
          <option value="Alugada">Alugada</option>
          <option value="Disponível">Disponível</option>
          <option value="Manutenção">Em Reforma</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Observações</label>
        <textarea class="form-textarea" id="pointNotes" rows="2" placeholder="Nº da UC, vencimentos, dados do inquilino..."></textarea>
      </div>

      <button class="btn-main" id="btnSavePoint">Salvar Ponto</button>
      <button class="btn-danger" id="btnDeletePoint" style="display:none;">Excluir</button>
    </div>
  </div>

  <!-- Modal Lista -->
  <div class="modal" id="modalList">
    <div class="card">
      <div class="card-head">
        <h3>Lista de Locais</h3>
        <i data-lucide="x" style="cursor:pointer;" onclick="closeModals()"></i>
      </div>
      <div id="pointsContainer"></div>
    </div>
  </div>

  <!-- Modal Resumo -->
  <div class="modal" id="modalSummary">
    <div class="card">
      <div class="card-head">
        <h3>Resumo Geral</h3>
        <i data-lucide="x" style="cursor:pointer;" onclick="closeModals()"></i>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:12px;">
        <div style="background:rgba(245,158,11,0.1); border:1px solid var(--usina); padding:10px; border-radius:10px;">
          <div style="font-size:10px; color:var(--usina); font-weight:700;">GERAÇÃO</div>
          <div style="font-size:16px; font-weight:800;" id="stGen">0 kWh</div>
        </div>
        <div style="background:rgba(59,130,246,0.1); border:1px solid var(--cliente); padding:10px; border-radius:10px;">
          <div style="font-size:10px; color:var(--cliente); font-weight:700;">CONSUMO CLIENTES</div>
          <div style="font-size:16px; font-weight:800;" id="stCons">0 kWh</div>
        </div>
      </div>
      <div style="background:rgba(16,185,129,0.1); border:1px solid var(--aluguel); padding:10px; border-radius:10px; margin-bottom:12px;">
        <div style="font-size:10px; color:var(--aluguel); font-weight:700;">CASAS DE ALUGUEL</div>
        <div style="font-size:16px; font-weight:800;" id="stRent">0 Imóveis</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let points = JSON.parse(localStorage.getItem('solar_db') || '[]');
    let currentType = 'usina';
    let isOwnerMode = true; // Alterna pelo clique no topo
    let activeMarkers = {};

    const map = L.map('map', { zoomControl: false }).setView([-15.3181, -49.1179], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    lucide.createIcons();

    // Botão Secreto no Título (Alterna entre Modo Admin e Modo Vendas/Cliente)
    let brandClicks = 0;
    document.getElementById('brandBtn').addEventListener('click', () => {
      brandClicks++;
      if (brandClicks >= 3) {
        isOwnerMode = !isOwnerMode;
        brandClicks = 0;
        document.getElementById('modeBadge').innerText = isOwnerMode ? 'ADM' : 'DEMO';
        document.getElementById('modeBadge').style.background = isOwnerMode ? 'rgba(255,255,255,0.1)' : '#10b981';
        renderMarkers();
      }
    });

    function createPinIcon(type) {
      const icons = { usina: 'sun', cliente: 'zap', aluguel: 'home' };
      return L.divIcon({
        className: 'pin-wrap',
        html: `<div class="custom-pin ${type}"><i data-lucide="${icons[type]}" style="width:16px;height:16px;color:#fff"></i></div>`,
        iconSize: [34, 34], iconAnchor: [17, 17]
      });
    }

    function renderMarkers() {
      Object.keys(activeMarkers).forEach(id => map.removeLayer(activeMarkers[id]));
      activeMarkers = {};

      points.forEach(p => {
        // No Modo Demo/Vendas, esconde casas de aluguel se quiser apresentar só energia
        if (!isOwnerMode && p.type === 'aluguel') return;

        const marker = L.marker([p.lat, p.lng], { icon: createPinIcon(p.type) }).addTo(map);
        marker.on('click', () => openEditForm(p.id));
        activeMarkers[p.id] = marker;
      });

      lucide.createIcons();
      updateStats();
    }

    map.on('click', (e) => openNewForm(e.latlng.lat, e.latlng.lng));

    // Controls
    document.getElementById('btnToggleCrosshair').addEventListener('click', () => {
      document.getElementById('crosshair').classList.toggle('active');
    });

    document.getElementById('btnConfirmCrosshair').addEventListener('click', () => {
      const center = map.getCenter();
      document.getElementById('crosshair').classList.remove('active');
      openNewForm(center.lat, center.lng);
    });

    function openNewForm(lat, lng) {
      document.getElementById('pointId').value = '';
      document.getElementById('pointLat').value = lat;
      document.getElementById('pointLng').value = lng;
      document.getElementById('pointName').value = '';
      document.getElementById('pointKwh').value = '';
      document.getElementById('pointVal').value = '';
      document.getElementById('pointNotes').value = '';
      document.getElementById('formTitle').innerText = 'Novo Ponto';
      document.getElementById('btnDeletePoint').style.display = 'none';
      setType('usina');
      document.getElementById('modalForm').classList.add('active');
    }

    function openEditForm(id) {
      const p = points.find(item => item.id === id);
      if (!p) return;
      document.getElementById('pointId').value = p.id;
      document.getElementById('pointLat').value = p.lat;
      document.getElementById('pointLng').value = p.lng;
      document.getElementById('pointName').value = p.name;
      document.getElementById('pointKwh').value = p.kwh || '';
      document.getElementById('pointVal').value = p.val || '';
      document.getElementById('pointNotes').value = p.notes || '';
      if(p.status) document.getElementById('pointStatus').value = p.status;

      document.getElementById('formTitle').innerText = 'Editar Ponto';
      document.getElementById('btnDeletePoint').style.display = 'block';
      setType(p.type);
      document.getElementById('modalForm').classList.add('active');
    }

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
      
      const rentalGrp = document.getElementById('rentalStatusGroup');
      if(type === 'aluguel') {
        rentalGrp.style.display = 'block';
        document.getElementById('lblKwh').innerText = 'Consumo Média (kWh)';
        document.getElementById('lblVal').innerText = 'Valor Aluguel (R$)';
      } else {
        rentalGrp.style.display = 'none';
        document.getElementById('lblKwh').innerText = type === 'usina' ? 'Geração (kWh)' : 'Consumo (kWh)';
        document.getElementById('lblVal').innerText = type === 'usina' ? 'Custo (%)' : 'Desconto (%)';
      }
    }

    document.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));

    document.getElementById('btnSavePoint').addEventListener('click', () => {
      const id = document.getElementById('pointId').value || Date.now().toString();
      const lat = parseFloat(document.getElementById('pointLat').value);
      const lng = parseFloat(document.getElementById('pointLng').value);
      const name = document.getElementById('pointName').value || 'Novo Ponto';
      const kwh = parseFloat(document.getElementById('pointKwh').value) || 0;
      const val = parseFloat(document.getElementById('pointVal').value) || 0;
      const notes = document.getElementById('pointNotes').value;
      const status = document.getElementById('pointStatus').value;

      const idx = points.findIndex(p => p.id === id);
      const item = { id, lat, lng, type: currentType, name, kwh, val, notes, status };

      if (idx >= 0) points[idx] = item; else points.push(item);

      localStorage.setItem('solar_db', JSON.stringify(points));
      renderMarkers();
      closeModals();
    });

    document.getElementById('btnDeletePoint').addEventListener('click', () => {
      const id = document.getElementById('pointId').value;
      points = points.filter(p => p.id !== id);
      localStorage.setItem('solar_db', JSON.stringify(points));
      renderMarkers();
      closeModals();
    });

    function updateStats() {
      let gen = 0, cons = 0, rent = 0;
      points.forEach(p => {
        if (p.type === 'usina') gen += p.kwh;
        if (p.type === 'cliente') cons += p.kwh;
        if (p.type === 'aluguel') rent++;
      });
      document.getElementById('stGen').innerText = `${gen.toLocaleString()} kWh`;
      document.getElementById('stCons').innerText = `${cons.toLocaleString()} kWh`;
      document.getElementById('stRent').innerText = `${rent} Casa(s)`;
    }

    // Exportar Backup em formato TXT
    document.getElementById('btnExport').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(points, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `backup_solar_imoveis_${new Date().toISOString().slice(0,10)}.txt`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
    document.getElementById('btnList').addEventListener('click', () => document.getElementById('modalList').classList.add('active'));
    document.getElementById('btnSummary').addEventListener('click', () => document.getElementById('modalSummary').classList.add('active'));
    document.getElementById('btnLocate').addEventListener('click', () => {
      navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 16));
    });

    renderMarkers();
  </script>
</body>
</html>
