<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gestão Solar & Imóveis 3D Pro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MapLibre GL JS CSS & JS (Para mapas 3D/Satélite com suporte a tilt/pitch e relevo) -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            solar: {
              yellow: '#FBBF24',
              orange: '#F97316',
              blue: '#3B82F6',
              emerald: '#10B981',
              purple: '#A855F7',
              dark: '#0B0F19',
              card: 'rgba(20, 27, 45, 0.92)'
            }
          }
        }
      }
    }
  </script>

  <style>
    body, html {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0b0f19;
      color: #f8fafc;
    }

    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }

    /* Modais e Glassmorphism */
    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }

    /* Custom MapLibre Popups */
    .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.95) !important;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 1rem !important;
      color: #f8fafc !important;
      padding: 14px !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
    }
    .maplibregl-popup-tip {
      border-top-color: rgba(15, 23, 42, 0.95) !important;
      border-bottom-color: rgba(15, 23, 42, 0.95) !important;
    }
    .maplibregl-popup-close-button {
      color: #9ca3af !important;
      font-size: 16px !important;
      padding: 6px 10px !important;
    }

    /* Transição do Modal */
    .sheet-transition {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Pin Hover Effect */
    .marker-pin-wrap {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6));
    }
    .marker-pin-wrap:hover {
      transform: scale(1.18);
    }

    /* Crosshair Target */
    .crosshair-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .crosshair-overlay.active {
      display: flex;
    }
    .crosshair-pin {
      width: 44px;
      height: 44px;
      border: 3px solid #3b82f6;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.25);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
      transform: translateY(-22px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col relative">

  <!-- Top Bar -->
  <header class="absolute top-3 left-3 right-3 z-20 flex justify-between items-center pointer-events-none">
    <div id="brandBtn" class="glass-panel px-3.5 py-2 rounded-2xl flex items-center space-x-2.5 shadow-xl pointer-events-auto border border-amber-500/20 cursor-pointer active:scale-95 transition">
      <div class="p-1.5 bg-amber-500/20 rounded-xl text-amber-400">
        <i data-lucide="sun" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-xs font-black tracking-wide uppercase text-slate-200">Solar & Imóveis 3D</h1>
          <span id="modeBadge" class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-amber-500/20 text-amber-400 border border-amber-500/30">ADM</span>
        </div>
        <p class="text-[9px] text-slate-400 font-medium">Toque 3x na logo para alternar o modo</p>
      </div>
    </div>

    <!-- Botões de Ação Topo -->
    <div class="flex items-center space-x-2 pointer-events-auto">
      <button onclick="toggleConfigModal()" class="glass-panel p-2.5 rounded-2xl text-slate-200 hover:text-white active:scale-95 transition shadow-lg border border-white/10 bg-slate-900/90 text-sky-400" title="Configurar Planilha">
        <i data-lucide="database" class="w-5 h-5"></i>
      </button>

      <button onclick="toggleStatsModal()" class="glass-panel p-2.5 rounded-2xl text-slate-200 hover:text-white active:scale-95 transition shadow-lg border border-white/10 bg-slate-900/90 text-amber-400" title="Resumo Financeiro">
        <i data-lucide="pie-chart" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Container do Mapa 3D -->
  <div id="map" class="w-full h-full"></div>

  <!-- Mira para marcação precisa (Ativada pelo Botão +) -->
  <div class="crosshair-overlay" id="crosshair">
    <div class="crosshair-pin"></div>
    <button onclick="confirmCrosshairLocation()" class="pointer-events-auto mt-4 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-black px-6 py-3 rounded-full shadow-2xl transition flex items-center gap-2 text-xs uppercase tracking-wider">
      <i data-lucide="check-circle" class="w-5 h-5"></i> Confirmar Ponto Aqui
    </button>
  </div>

  <!-- Botão Flutuante (+) para Marcar Ponto -->
  <button id="btnToggleCrosshair" onclick="toggleCrosshairMode()" class="absolute bottom-24 right-4 z-20 w-14 h-14 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center shadow-2xl border-2 border-white/30 active:scale-90 transition" title="Marcar Novo Ponto">
    <i data-lucide="plus" class="w-7 h-7"></i>
  </button>

  <!-- Controles Flutuantes do Mapa (2D/3D & GPS) -->
  <div class="absolute right-4 top-20 z-20 flex flex-col space-y-2 pointer-events-auto">
    <button onclick="toggle3DView()" id="btn3dToggle" class="glass-panel p-3 rounded-2xl text-slate-200 active:scale-90 transition shadow-xl border border-white/10 bg-slate-900/90 text-amber-400 flex items-center justify-center font-black text-xs" title="Alternar Visão 2D / 3D">
      3D
    </button>
    <button onclick="locateUser()" class="glass-panel p-3 rounded-2xl text-slate-200 active:scale-90 transition shadow-xl border border-white/10 bg-slate-900/90 text-sky-400 flex items-center justify-center" title="Minha Posição GPS">
      <i data-lucide="crosshair" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- Bottom Actions Bar -->
  <div class="absolute bottom-4 left-3 right-3 z-20 flex gap-2 pointer-events-none">
    <button onclick="toggleDrawer()" class="flex-1 glass-panel py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 shadow-2xl border border-white/15 active:scale-98 transition bg-slate-900/90 pointer-events-auto">

      <span class="text-xs font-bold text-slate-200" id="drawerSummaryText">Pontos Cadastrados</span>
    </button>

    <button onclick="syncDataFromSheet()" class="glass-panel py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-1.5 shadow-2xl border border-white/15 active:scale-98 transition bg-slate-900/90 text-emerald-400 font-bold text-xs pointer-events-auto" title="Sincronizar com a Planilha">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>

  <!-- Drawer / Lista de Registros -->
  <div id="drawer" class="fixed inset-x-0 bottom-0 z-30 transform translate-y-full sheet-transition max-h-[80vh] h-auto glass-panel rounded-t-3xl flex flex-col shadow-2xl border-t border-white/20">
    <div class="w-full py-3 flex justify-center cursor-pointer" onclick="toggleDrawer()">
      <div class="w-12 h-1.5 bg-slate-600 rounded-full"></div>
    </div>

    <div class="px-5 pb-3 flex justify-between items-center border-b border-slate-800">
      <div>

        <p class="text-[11px] text-slate-400">Gerencie usinas, clientes e imóveis</p>

      <button onclick="toggleDrawer()" class="p-1.5 bg-slate-800 rounded-full text-slate-400 hover:text-white">

      </button>
    </div>

    <!-- Lista com Scroll -->
    <div id="locationsList" class="flex-1 overflow-y-auto p-4 space-y-2.5 max-h-[50vh]">

    </div>

  <!-- Modal de Cadastro / Edição -->

    <div id="modalContent" class="w-full sm:max-w-md glass-panel rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto border-t sm:border border-white/20 shadow-2xl transform translate-y-10 transition-transform duration-300">
      
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modalTitle" class="text-sm font-black text-white uppercase tracking-wider">Novo Ponto</h3>
        <button onclick="closeFormModal()" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-full">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="pointForm" onsubmit="savePoint(event)" class="space-y-3">
        <input type="hidden" id="pointId" />
        <input type="hidden" id="pointLat" />
        <input type="hidden" id="pointLng" />

        <!-- Seleção do Tipo -->
        <div>
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase mb-1.5">Tipo de Ponto</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" onclick="setType('usina')" id="btnTypeUsina" class="py-2 px-1 rounded-xl border border-slate-700 text-[11px] font-bold flex items-center justify-center gap-1 text-slate-400">
              <i data-lucide="sun" class="w-3.5 h-3.5"></i> Usina
            </button>
            <button type="button" onclick="setType('cliente')" id="btnTypeCliente" class="py-2 px-1 rounded-xl border border-slate-700 text-[11px] font-bold flex items-center justify-center gap-1 text-slate-400">
              <i data-lucide="zap" class="w-3.5 h-3.5"></i> Cliente
            </button>
            <button type="button" onclick="setType('aluguel')" id="btnTypeAluguel" class="py-2 px-1 rounded-xl border border-slate-700 text-[11px] font-bold flex items-center justify-center gap-1 text-slate-400">
              <i data-lucide="home" class="w-3.5 h-3.5"></i> Aluguel
            </button>
          </div>
        </div>

        <!-- Nome -->
        <div>
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase mb-1">Nome / Identificação</label>
          <input type="text" id="pointName" required placeholder="Ex: Usina Solar 01 ou Casa do João" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
        </div>

        <!-- Propriedade / Sociedade (Apenas Usinas e Casas) -->
        <div id="groupOwnership">
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase mb-1">Propriedade / Titularidade</label>
          <select id="pointOwnership" onchange="renderUsinaDropdown()" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500 transition">
            <option value="Proprio">100% Minha (Própria)</option>
            <option value="Sociedade">Sociedade (Com Sogro)</option>
          </select>

        <!-- Usina Fornecedora (Apenas Clientes) -->
        <div id="groupSourceUsina" class="hidden">
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase mb-1">Usina Fornecedora do Crédito</label>
          <select id="pointSourceUsina" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500 transition">

          </select>

        <!-- Zona / Localização (Para Iluminação Pública) -->
        <div id="groupZone">
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase mb-1">Localização (Taxa de Iluminação Pública)</label>

            <option value="Rural">Zona Rural / Fora da Cidade (Isento R$ 0,00)</option>

            <label id="lblKwh" class="block text-[11px] font-extrabold text-slate-400 uppercase mb-1">Geração (kWh/mês)</label>

      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-2">
          <i data-lucide="database" class="w-4 h-4 text-sky-400"></i> Google Planilhas

        <button onclick="toggleConfigModal()" class="p-1 bg-slate-800 text-slate-400 rounded-full">

      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-amber-400"></i> Dashboard do Empresário
        </h3>
        <button onclick="toggleStatsModal()" class="p-1 bg-slate-800 text-slate-400 rounded-full">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Métricas Financeiras Consolidadas -->
      <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-2xl">
          <p class="text-[10px] uppercase font-bold text-emerald-400">Faturamento Bruto</p>
          <p id="statFatTotal" class="text-lg font-black text-white mt-1">R$ 0,00</p>
          <p class="text-[10px] text-slate-400">Energia + Aluguel</p>
        </div>
        <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-2xl">
          <p class="text-[10px] uppercase font-bold text-amber-400">Lucro Líquido Solar</p>
          <p id="statLucroTotal" class="text-lg font-black text-white mt-1">R$ 0,00</p>
          <p class="text-[10px] text-slate-400">Livre de custos</p>
        </div>
      </div>

      <div id="statsUsinaDetails" class="space-y-2">
        <!-- Renderizado dinamicamente -->
      </div>

      <button onclick="toggleStatsModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs transition">
        Fechar
      </button>
    </div>
  </div>

  <script>
    // Parâmetros Financeiros Fixos do Negócio
    const TARIFA_KWH_PUBLICO = 0.81; // R$ 0,81
    const DESCONTO_FIXO = 0.20;      // 20%
    const COBRANCA_KWH_CLIENTE = TARIFA_KWH_PUBLICO * (1 - DESCONTO_FIXO); // R$ 0,648 / kWh
    const CUSTO_KWH_PRODUCAO = 0.17;  // R$ 0,17 / kWh
    const ILUMINACAO_PUBLICA_URBANA = 21.00; // R$ 21,00/mês

    // Estados da Aplicação
    let map;
    let points = [];
    let scriptUrl = localStorage.getItem('solar_sheet_url_v3') || '';
    let currentType = 'usina';
    let appModeIndex = 0; // 0: ADM, 1: GESTAO, 2: DEMO
    const appModes = ['ADM', 'GESTAO', 'DEMO'];
    let is3D = false;
    let crosshairActive = false;

    // Inicialização da Aplicação
    window.onload = function() {
      lucide.createIcons();
      loadLocalPoints();
      initMap();
      setupBrandClick();
    };

    function initMap() {
      // MapLibre GL com tiles de satélite
      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'raster-tiles': {
              type: 'raster',
              tiles: ['https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}'],
              tileSize: 256
            }
          },
          layers: [{
            id: 'simple-tiles',
            type: 'raster',
            source: 'raster-tiles',
            minzoom: 0,
            maxzoom: 22
          }]
        },
        center: [-49.1179, -15.3181], // Coordenadas Padrão
        zoom: 14,
        pitch: 0,
        bearing: 0
      });

      map.on('load', () => {
        renderMarkers();
      });

      // Clique simples no mapa para abrir o formulário
      map.on('click', (e) => {
        if (!crosshairActive) {
          openFormModal(e.lngLat.lat, e.lngLat.lng);
        }
      });
    }

    function calculateClientFinance(kwh, isRural) {
      const faturamento = kwh * COBRANCA_KWH_CLIENTE;
      const ilumPublica = isRural ? 0 : ILUMINACAO_PUBLICA_URBANA;
      const custoProducao = kwh * CUSTO_KWH_PRODUCAO;
      const custoTotal = custoProducao + ilumPublica;
      const lucroLiquido = faturamento - custoTotal;
      const margem = faturamento > 0 ? (lucroLiquido / faturamento) * 100 : 0;

      return { faturamento, custoProducao, ilumPublica, custoTotal, lucroLiquido, margem };
    }

    function createMarkerSVG(point) {
      let pinColor = '#FBBF24'; // Amarelo Padrão
      let iconInner = '';
      let badgeText = '';

      if (point.type === 'usina') {
        pinColor = point.ownership === 'Sociedade' ? '#D97706' : '#F59E0B';
        iconInner = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>`;
        badgeText = point.ownership === 'Sociedade' ? 'SOC' : 'EU';
      } else if (point.type === 'aluguel') {
        pinColor = '#3B82F6'; // Casa de Aluguel SEMPRE Azul
        iconInner = `<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>`;
        badgeText = 'ALUG';
      } else if (point.type === 'cliente') {
        iconInner = `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>`;
        
        // Identifica Usina Fornecedora
        const sourceUsina = points.find(p => p.type === 'usina' && p.name === point.sourceUsina);
        if (sourceUsina) {
          if (sourceUsina.ownership === 'Sociedade') {
            pinColor = '#10B981'; // Verde = Usina do Sócio (Sogro)
            badgeText = 'SOC';
          } else {
            pinColor = '#FBBF24'; // Amarelo = Minha Usina Própria
            badgeText = 'EU';
          }
        } else {
          pinColor = '#3B82F6'; // Azul = Não vinculado
          badgeText = 'SOL';
        }
      }

      const el = document.createElement('div');
      el.className = 'marker-pin-wrap';
      el.innerHTML = `
        <div style="position: relative; width: 40px; height: 50px;">
          <svg width="40" height="50" viewBox="0 0 38 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 0C8.506 0 0 8.506 0 19C0 31.4 19 48 19 48C19 48 38 31.4 38 19C38 8.506 29.494 0 19 0Z" fill="${pinColor}" />
            <circle cx="19" cy="18" r="13" fill="#0B0F19" />
            <g transform="translate(7, 6)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
              ${iconInner}
            </g>
          </svg>
          <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0B0F19; color: ${pinColor}; border: 1px solid ${pinColor}; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 6px; white-space: nowrap;">
            ${badgeText}
          </div>
        </div>
      `;
      return el;
    }

    let currentMarkers = [];

    function renderMarkers() {
      currentMarkers.forEach(m => m.remove());
      currentMarkers = [];

      const currentMode = appModes[appModeIndex];

      points.forEach(pt => {
        // Modo DEMO esconde casas de aluguel
        if (currentMode === 'DEMO' && pt.type === 'aluguel') return;

        const el = createMarkerSVG(pt);
        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([pt.lng, pt.lat])
          .addTo(map);

        // Configuração do Popup no Clique
        const popupContent = buildPopupHTML(pt, currentMode);
        const popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupContent);
        marker.setPopup(popup);

        currentMarkers.push(marker);
      });

      renderLocationList();
      updateDrawerSummary();
    }

    function buildPopupHTML(pt, mode) {
      const isUsina = pt.type === 'usina';
      const isAluguel = pt.type === 'aluguel';
      const isCliente = pt.type === 'cliente';
      const isRural = pt.zone === 'Rural';

      let headerBadge = '';
      if (isUsina) headerBadge = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Usina Solar (${pt.ownership === 'Sociedade' ? 'Sócio' : 'Própria'})</span>`;
      else if (isAluguel) headerBadge = `<span class="bg-sky-500/20 text-sky-400 border border-sky-500/30 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Casa Aluguel</span>`;
      else headerBadge = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Cliente Consumidor</span>`;

      let financeHTML = '';

      if (isCliente) {
        const fin = calculateClientFinance(pt.kwh || 0, isRural);

        if (mode === 'GESTAO' || mode === 'ADM') {
          financeHTML = `
            <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 space-y-1 text-xs">
              <div class="flex justify-between">
                <span class="text-slate-400">Consumo:</span>
                <span class="font-bold text-slate-200">${pt.kwh || 0} kWh/mês</span>
              </div>
              <div class="flex justify-between text-emerald-400">
                <span>Faturamento:</span>
                <span class="font-black">R$ ${fin.faturamento.toFixed(2)}</span>
              </div>
              <div class="flex justify-between text-slate-400">
                <span>Custo Produção:</span>
                <span>R$ ${fin.custoProducao.toFixed(2)}</span>
              </div>
              <div class="flex justify-between text-slate-400">
                <span>Ilum. Pública (${isRural ? 'Rural' : 'Urbana'}):</span>
                <span>R$ ${fin.ilumPublica.toFixed(2)}</span>
              </div>
              <div class="border-t border-slate-800 pt-1 flex justify-between text-amber-400 font-extrabold text-sm">
                <span>LUCRO LÍQUIDO:</span>
                <span>R$ ${fin.lucroLiquido.toFixed(2)} /mês</span>
              </div>
            </div>
          `;
        } else {
          // Modo DEMO para Clientes
          financeHTML = `
            <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 space-y-1 text-xs">
              <div class="flex justify-between">
                <span class="text-slate-400">Consumo Atendido:</span>
                <span class="font-bold text-slate-200">${pt.kwh || 0} kWh/mês</span>
              </div>
              <div class="flex justify-between text-amber-400">
                <span>Desconto Aplicado:</span>
                <span class="font-bold">20% Fixo</span>
              </div>
            </div>
          `;
        }
      } else if (isAluguel) {
        financeHTML = `
          <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 space-y-1 text-xs">
            <div class="flex justify-between">
              <span class="text-slate-400">Valor do Aluguel:</span>
              <span class="font-black text-sky-400">R$ ${(pt.val || 0).toFixed(2)} /mês</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Status:</span>
              <span class="font-bold text-slate-200">${pt.status || 'Alugada'}</span>
            </div>
          </div>
        `;
      } else if (isUsina) {
        financeHTML = `
          <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 space-y-1 text-xs">
            <div class="flex justify-between">
              <span class="text-slate-400">Geração Média:</span>
              <span class="font-black text-amber-400">${pt.kwh || 0} kWh/mês</span>
            </div>
          </div>
        `;
      }

      return `
        <div class="p-1 space-y-2 min-w-[210px]">
          <div class="flex justify-between items-center">${headerBadge}</div>
          <div>
            <h4 class="font-black text-sm text-white">${escapeHtml(pt.name)}</h4>
            ${pt.sourceUsina ? `<p class="text-[10px] text-slate-400">Usina: ${escapeHtml(pt.sourceUsina)}</p>` : ''}
          </div>
          ${financeHTML}
          ${pt.notes ? `<p class="text-[10px] text-slate-300 italic bg-slate-900/50 p-1.5 rounded-lg border border-slate-800">${escapeHtml(pt.notes)}</p>` : ''}
          <div class="pt-1 flex space-x-1.5">
            <button onclick="openFormModal(${pt.lat}, ${pt.lng}, '${pt.id}')" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-bold rounded-lg text-center">
              Editar
            </button>
            <button onclick="openGoogleMapsRoute(${pt.lat}, ${pt.lng})" class="py-1.5 px-2.5 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 text-[11px] font-bold rounded-lg">
              GPS Rota
            </button>
          </div>
        </div>
      `;
    }

    function setupBrandClick() {
      let clicks = 0;
      let timer = null;
      const brandBtn = document.getElementById('brandBtn');

      brandBtn.addEventListener('click', () => {
        clicks++;
        if (timer) clearTimeout(timer);

        timer = setTimeout(() => {
          if (clicks >= 3) {
            appModeIndex = (appModeIndex + 1) % appModes.length;
            const newMode = appModes[appModeIndex];
            
            const badge = document.getElementById('modeBadge');
            badge.innerText = newMode;
            
            if (newMode === 'ADM') badge.className = 'text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-amber-500/20 text-amber-400 border border-amber-500/30';
            else if (newMode === 'GESTAO') badge.className = 'text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            else badge.className = 'text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-sky-500/20 text-sky-400 border border-sky-500/30';

            renderMarkers();
          }
          clicks = 0;
        }, 400);
      });
    }

    function setType(type) {
      currentType = type;
      const btnUsina = document.getElementById('btnTypeUsina');
      const btnCliente = document.getElementById('btnTypeCliente');
      const btnAluguel = document.getElementById('btnTypeAluguel');

      btnUsina.className = type === 'usina' ? 'py-2 px-1 rounded-xl border border-amber-500 bg-amber-500/10 text-[11px] font-bold flex items-center justify-center gap-1 text-amber-400' : 'py-2 px-1 rounded-xl border border-slate-700 text-[11px] font-bold flex items-center justify-center gap-1 text-slate-400';
      btnCliente.className = type === 'cliente' ? 'py-2 px-1 rounded-xl border border-emerald-500 bg-emerald-500/10 text-[11px] font-bold flex items-center justify-center gap-1 text-emerald-400' : 'py-2 px-1 rounded-xl border border-slate-700 text-[11px] font-bold flex items-center justify-center gap-1 text-slate-400';
      btnAluguel.className = type === 'aluguel' ? 'py-2 px-1 rounded-xl border border-sky-500 bg-sky-500/10 text-[11px] font-bold flex items-center justify-center gap-1 text-sky-400' : 'py-2 px-1 rounded-xl border border-slate-700 text-[11px] font-bold flex items-center justify-center gap-1 text-slate-400';

      const groupOwnership = document.getElementById('groupOwnership');
      const groupSourceUsina = document.getElementById('groupSourceUsina');
      const groupRentalStatus = document.getElementById('groupRentalStatus');

      if (type === 'aluguel') {
        groupOwnership.classList.remove('hidden');
        groupSourceUsina.classList.add('hidden');
        groupRentalStatus.classList.remove('hidden');
        document.getElementById('lblKwh').innerText = 'Consumo Média (kWh)';
        document.getElementById('lblVal').innerText = 'Valor Aluguel (R$)';
      } else if (type === 'cliente') {
        groupOwnership.classList.add('hidden');
        groupSourceUsina.classList.remove('hidden');
        groupRentalStatus.classList.add('hidden');
        document.getElementById('lblKwh').innerText = 'Consumo (kWh/mês)';
        document.getElementById('lblVal').innerText = 'Desconto (%) [20%]';
      } else { // Usina
        groupOwnership.classList.remove('hidden');
        groupSourceUsina.classList.add('hidden');
        groupRentalStatus.classList.add('hidden');
        document.getElementById('lblKwh').innerText = 'Geração (kWh/mês)';
        document.getElementById('lblVal').innerText = 'Custo Produção R$/kWh';
      }

      renderUsinaDropdown();
    }

    function renderUsinaDropdown() {
      const select = document.getElementById('pointSourceUsina');
      select.innerHTML = '<option value="">Selecione a Usina...</option>';
      points.filter(p => p.type === 'usina').forEach(u => {
        select.innerHTML += `<option value="${escapeHtml(u.name)}">${escapeHtml(u.name)} (${u.ownership === 'Sociedade' ? 'Sócio' : 'Própria'})</option>`;
      });
    }

    function openFormModal(lat, lng, editId = null) {
      const modal = document.getElementById('modalForm');
      const content = document.getElementById('modalContent');

      document.getElementById('pointId').value = editId || '';
      document.getElementById('pointLat').value = lat;
      document.getElementById('pointLng').value = lng;

      if (editId) {
        const pt = points.find(p => p.id.toString() === editId.toString());
        if (pt) {
          document.getElementById('modalTitle').innerText = 'Editar Ponto';
          document.getElementById('pointName').value = pt.name || '';
          document.getElementById('pointOwnership').value = pt.ownership || 'Proprio';
          document.getElementById('pointZone').value = pt.zone || 'Urbana';
          document.getElementById('pointKwh').value = pt.kwh || '';
          document.getElementById('pointVal').value = pt.val || '';
          document.getElementById('pointStatus').value = pt.status || 'Alugada';
          document.getElementById('pointNotes').value = pt.notes || '';
          setType(pt.type);
          if (pt.sourceUsina) document.getElementById('pointSourceUsina').value = pt.sourceUsina;
          document.getElementById('btnDeletePoint').classList.remove('hidden');
        }
      } else {
        document.getElementById('modalTitle').innerText = 'Novo Ponto';
        document.getElementById('pointForm').reset();
        setType('usina');
        document.getElementById('btnDeletePoint').classList.add('hidden');
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('translate-y-10');
      }, 10);
    }

    function closeFormModal() {
      const modal = document.getElementById('modalForm');
      const content = document.getElementById('modalContent');
      modal.classList.add('opacity-0');
      content.classList.add('translate-y-10');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    async function savePoint(e) {
      e.preventDefault();

      const id = document.getElementById('pointId').value || 'pt_' + Date.now();
      const lat = parseFloat(document.getElementById('pointLat').value);
      const lng = parseFloat(document.getElementById('pointLng').value);
      const name = document.getElementById('pointName').value;
      const ownership = document.getElementById('pointOwnership').value;
      const sourceUsina = document.getElementById('pointSourceUsina').value;
      const zone = document.getElementById('pointZone').value;
      const kwh = parseFloat(document.getElementById('pointKwh').value) || 0;
      const val = parseFloat(document.getElementById('pointVal').value) || 0;
      const status = document.getElementById('pointStatus').value;
      const notes = document.getElementById('pointNotes').value;

      const item = { id, lat, lng, type: currentType, name, ownership, sourceUsina, zone, kwh, val, status, notes };

      const existingIdx = points.findIndex(p => p.id.toString() === id.toString());
      if (existingIdx >= 0) points[existingIdx] = item;
      else points.push(item);

      saveLocalPoints();
      renderMarkers();
      closeFormModal();

      if (scriptUrl) {
        try {
          await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'create', data: item })
          });
        } catch (err) {
          console.error("Erro ao enviar para planilha", err);
        }
      }
    }

    async function deleteCurrentPoint() {
      const id = document.getElementById('pointId').value;
      if (confirm("Excluir realmente este ponto?")) {
        points = points.filter(p => p.id.toString() !== id.toString());
        saveLocalPoints();
        renderMarkers();
        closeFormModal();

        if (scriptUrl) {
          try {
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'delete', data: { id } })
            });
          } catch (err) {
            console.error("Erro ao excluir na planilha", err);
          }
        }
      }
    }

    async function syncDataFromSheet() {
      if (!scriptUrl) {
        toggleConfigModal();
        return;
      }
      try {
        const res = await fetch(scriptUrl);
        const data = await res.json();
        if (Array.isArray(data)) {
          points = data;
          saveLocalPoints();
          renderMarkers();
          alert("Dados sincronizados com sucesso da Planilha!");
        }
      } catch (err) {
        alert("Erro ao sincronizar da planilha. Verifique a URL do App Script.");
      }
    }

    function loadLocalPoints() {
      const saved = localStorage.getItem('solar_app_3d_points');
      if (saved) {
        try { points = JSON.parse(saved); } catch(e) { points = []; }
      }
    }

    function saveLocalPoints() {
      localStorage.setItem('solar_app_3d_points', JSON.stringify(points));
    }

    function renderLocationList() {
      const container = document.getElementById('locationsList');
      const currentMode = appModes[appModeIndex];

      const visible = points.filter(pt => !(currentMode === 'DEMO' && pt.type === 'aluguel'));

      if (visible.length === 0) {
        container.innerHTML = `<div class="py-6 text-center text-slate-500 text-xs">Nenhum ponto marcado.</div>`;
        return;
      }

      container.innerHTML = visible.map(pt => {
        const isUsina = pt.type === 'usina';
        const isAluguel = pt.type === 'aluguel';
        const colorClass = isUsina ? 'text-amber-400' : (isAluguel ? 'text-sky-400' : 'text-emerald-400');
        const iconName = isUsina ? 'sun' : (isAluguel ? 'home' : 'zap');

        return `
          <div onclick="centerMapOnPoint(${pt.lat}, ${pt.lng})" class="bg-slate-900/80 border border-slate-800 p-3 rounded-2xl flex items-center justify-between cursor-pointer active:scale-98 transition">
            <div class="flex items-center space-x-3">
              <div class="p-2 bg-slate-800 rounded-xl ${colorClass}">
                <i data-lucide="${iconName}" class="w-4 h-4"></i>
              </div>
              <div>
                <h4 class="text-xs font-bold text-white">${escapeHtml(pt.name)}</h4>
                <p class="text-[10px] text-slate-400">${pt.kwh ? pt.kwh + ' kWh/mês' : ''} ${pt.val ? '• R$ ' + pt.val : ''}</p>
              </div>
            </div>
            <button onclick="event.stopPropagation(); openFormModal(${pt.lat}, ${pt.lng}, '${pt.id}')" class="p-2 text-slate-400 hover:text-white">
              <i data-lucide="edit-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function updateDrawerSummary() {
      const usinas = points.filter(p => p.type === 'usina').length;
      const clientes = points.filter(p => p.type === 'cliente').length;
      const alugueis = points.filter(p => p.type === 'aluguel').length;
      document.getElementById('drawerSummaryText').innerText = `${points.length} Pontos (${usinas} Usinas, ${clientes} Clientes, ${alugueis} Aluguéis)`;
    }

    function toggleStatsModal() {
      const modal = document.getElementById('modalStats');
      const isHidden = modal.classList.contains('hidden');

      if (isHidden) {
        calculateBusinessStats();
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
      } else {
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 300);
      }
    }

    function calculateBusinessStats() {
      let fatSolar = 0;
      let lucroSolar = 0;
      let fatAluguel = 0;

      const usinas = points.filter(p => p.type === 'usina');
      const containerDetails = document.getElementById('statsUsinaDetails');
      containerDetails.innerHTML = '';

      usinas.forEach(u => {
        const clientesDaUsina = points.filter(p => p.type === 'cliente' && p.sourceUsina === u.name);
        const kwhGerado = u.kwh || 0;
        const kwhConsumido = clientesDaUsina.reduce((acc, c) => acc + (c.kwh || 0), 0);
        const saldoKwh = kwhGerado - kwhConsumido;

        let uLucro = 0;
        clientesDaUsina.forEach(c => {
          const fin = calculateClientFinance(c.kwh || 0, c.zone === 'Rural');
          fatSolar += fin.faturamento;
          lucroSolar += fin.lucroLiquido;
          uLucro += fin.lucroLiquido;
        });

        containerDetails.innerHTML += `
          <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl space-y-1">
            <div class="flex justify-between items-center text-xs">
              <span class="font-extrabold text-amber-400">${escapeHtml(u.name)} (${u.ownership === 'Sociedade' ? 'Sócio' : 'Própria'})</span>
              <span class="font-bold ${saldoKwh >= 0 ? 'text-emerald-400' : 'text-red-400'}">${saldoKwh} kWh Saldo</span>
            </div>
            <div class="flex justify-between text-[11px] text-slate-400">
              <span>Clientes Atendidos: ${clientesDaUsina.length}</span>
              <span class="text-slate-200 font-bold">Lucro: R$ ${uLucro.toFixed(2)}</span>
            </div>
          </div>
        `;
      });

      points.filter(p => p.type === 'aluguel').forEach(a => {
        fatAluguel += (a.val || 0);
      });

      document.getElementById('statFatTotal').innerText = `R$ ${(fatSolar + fatAluguel).toFixed(2)}`;
      document.getElementById('statLucroTotal').innerText = `R$ ${lucroSolar.toFixed(2)}`;
    }

    function toggle3DView() {
      is3D = !is3D;
      const btn = document.getElementById('btn3dToggle');

      if (is3D) {
        map.easeTo({ pitch: 60, bearing: -20, duration: 1000 });
        btn.className = 'glass-panel p-3 rounded-2xl text-slate-200 active:scale-90 transition shadow-xl border border-white/10 bg-amber-500 text-slate-950 font-black text-xs';
      } else {
        map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
        btn.className = 'glass-panel p-3 rounded-2xl text-slate-200 active:scale-90 transition shadow-xl border border-white/10 bg-slate-900/90 text-amber-400 font-black text-xs';
      }
    }

    function toggleCrosshairMode() {
      crosshairActive = !crosshairActive;
      const crosshairEl = document.getElementById('crosshair');
      if (crosshairActive) crosshairEl.classList.add('active');
      else crosshairEl.classList.remove('active');
    }

    function confirmCrosshairLocation() {
      const center = map.getCenter();
      toggleCrosshairMode();
      openFormModal(center.lat, center.lng);
    }

    function centerMapOnPoint(lat, lng) {
      map.flyTo({ center: [lng, lat], zoom: 17, pitch: is3D ? 60 : 0 });
      toggleDrawer();
    }

    function locateUser() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(p => {
          map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 16 });
        });
      }
    }

    function openGoogleMapsRoute(lat, lng) {
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    }

    function toggleDrawer() {
      const drawer = document.getElementById('drawer');
      drawer.classList.toggle('translate-y-full');
    }

    function toggleConfigModal() {
      const modal = document.getElementById('modalConfig');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        document.getElementById('sheetUrlInput').value = scriptUrl;
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
      } else {
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 300);
      }
    }

    function saveConfigUrl() {
      scriptUrl = document.getElementById('sheetUrlInput').value.trim();
      localStorage.setItem('solar_sheet_url_v3', scriptUrl);
      toggleConfigModal();
      alert('URL da Planilha salva!');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
